name: Setup Trigger

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: "Repository name"
        required: true
        type: string
      ci_workflow_name:
        description: "CI workflow name"
        required: true
        type: string
      ci_file_name:
        description: "CI file name"
        required: true
        type: string
      target_branch:
        description: "Branch to watch for CI failures; AI_FIX is created from this branch"
        required: false
        type: string
        default: "main"
      fix_branch_name:
        description: "Branch the AI will create/push fixes to"
        required: false
        type: string
        default: "AI_FIX"

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout central repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: central

      - name: Validate and sanitize inputs
        id: inputs
        run: |
          set -euo pipefail
          sanitize() {
            printf '%s' "$1" | sed -E 's/[^A-Za-z0-9._\/-]+/-/g; s/^[-.\/]+//; s/[-.\/]+$//'
          }
          RAW_TARGET_BRANCH="${{ github.event.inputs.target_branch }}"
          [ -z "$RAW_TARGET_BRANCH" ] && RAW_TARGET_BRANCH="main"
          SAFE_TARGET_BRANCH=$(sanitize "$RAW_TARGET_BRANCH")
          [ -z "$SAFE_TARGET_BRANCH" ] && SAFE_TARGET_BRANCH="main"
          RAW_FIX_BRANCH="${{ github.event.inputs.fix_branch_name }}"
          [ -z "$RAW_FIX_BRANCH" ] && RAW_FIX_BRANCH="AI_FIX"
          SAFE_FIX_BRANCH=$(sanitize "$RAW_FIX_BRANCH")
          [ -z "$SAFE_FIX_BRANCH" ] && SAFE_FIX_BRANCH="AI_FIX"
          echo "target_branch=$SAFE_TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "fix_branch_name=$SAFE_FIX_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Verify target branch exists
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          REPO="Test-abhishek1/${{ github.event.inputs.repo_name }}"
          BRANCH="${{ steps.inputs.outputs.target_branch }}"
          git ls-remote --exit-code --heads \
            "https://x-access-token:${PAT_TOKEN}@github.com/${REPO}.git" \
            "$BRANCH" > /dev/null

      - name: Get repository default branch
        id: defaultbranch
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          REPO="Test-abhishek1/${{ github.event.inputs.repo_name }}"
          DEFAULT_BRANCH=$(curl -fsSL \
            -H "Authorization: Bearer ${PAT_TOKEN}" \
            "https://api.github.com/repos/${REPO}" | jq -r '.default_branch')
          if [ -z "$DEFAULT_BRANCH" ] || [ "$DEFAULT_BRANCH" = "null" ]; then
            echo "::error::Could not determine default branch for $REPO"
            exit 1
          fi
          echo "default_branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Clone target repository
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO_NAME: ${{ github.event.inputs.repo_name }}
        run: |
          set -euo pipefail
          git clone \
            "https://x-access-token:${PAT_TOKEN}@github.com/Test-abhishek1/${REPO_NAME}.git" \
            repo

      - name: Verify template file
        run: |
          set -euo pipefail
          test -f central/.github/workflows/test.yml

      - name: Copy template into target repository
        run: |
          set -euo pipefail
          mkdir -p repo/.github/workflows
          cp central/.github/workflows/test.yml repo/.github/workflows/test.yml

      - name: Replace template placeholders
        env:
          TARGET_BRANCH: ${{ steps.inputs.outputs.target_branch }}
          FIX_BRANCH_NAME: ${{ steps.inputs.outputs.fix_branch_name }}
        run: |
          set -euo pipefail
          FILE="repo/.github/workflows/test.yml"
          CI_NAME="${{ github.event.inputs.ci_workflow_name }}"
          CI_FILE="${{ github.event.inputs.ci_file_name }}"
          REPO_NAME="${{ github.event.inputs.repo_name }}"
          SAFE_NAME=$(printf '%s\n' "$CI_NAME" | sed 's/[\/&]/\\&/g')
          SAFE_FILE=$(printf '%s\n' "$CI_FILE" | sed 's/[\/&]/\\&/g')
          SAFE_REPO=$(printf '%s\n' "$REPO_NAME" | sed 's/[\/&]/\\&/g')
          SAFE_TARGET=$(printf '%s\n' "$TARGET_BRANCH" | sed 's/[\/&]/\\&/g')
          SAFE_FIX=$(printf '%s\n' "$FIX_BRANCH_NAME" | sed 's/[\/&]/\\&/g')
          sed -i "s/__REPO_NAME__/$SAFE_REPO/g" "$FILE"
          sed -i "s/__CI_WORKFLOW_NAME__/$SAFE_NAME/g" "$FILE"
          sed -i "s/__CI_FILE_NAME__/$SAFE_FILE/g" "$FILE"
          sed -i "s/__TARGET_BRANCH__/$SAFE_TARGET/g" "$FILE"
          sed -i "s/__FIX_BRANCH_NAME__/$SAFE_FIX/g" "$FILE"

      - name: Show generated workflow
        run: cat repo/.github/workflows/test.yml

      - name: Commit and push workflow to default branch
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          DEFAULT_BRANCH: ${{ steps.defaultbranch.outputs.default_branch }}
        run: |
          set -euo pipefail
          cd repo
          git config user.name "AI-Bot"
          git config user.email "ai@bot.com"
          git add .github/workflows/test.yml
          if git diff --cached --quiet; then
            echo "No workflow changes to commit."
            exit 0
          fi
          git commit -m "Add AI Trigger Workflow"
          git push \
            "https://x-access-token:${PAT_TOKEN}@github.com/Test-abhishek1/${{ github.event.inputs.repo_name }}.git" \
            "HEAD:${DEFAULT_BRANCH}"

      - name: Add marker to watched branch
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          REPO="Test-abhishek1/${{ github.event.inputs.repo_name }}"
          BRANCH="${{ steps.inputs.outputs.target_branch }}"
          git clone --branch "$BRANCH" \
            "https://x-access-token:${PAT_TOKEN}@github.com/${REPO}.git" \
            repo-branch
          cd repo-branch
          echo "AI trigger installed; watching branch: ${BRANCH}" > temp.txt
          git config user.name "AI-Bot"
          git config user.email "ai@bot.com"
          git add temp.txt
          if git diff --cached --quiet; then
            echo "No marker changes to commit."
            exit 0
          fi
          git commit -m "Add AI trigger marker"
          git push origin "$BRANCH"
